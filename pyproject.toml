[build-system]
requires = ["pybind11", "scikit-build-core","cmake>=3.18","tensorflow<2.22"]
build-backend = "scikit_build_core.build"


[project]
name = "sphysics"
authors = [
  { name = "Stefan Wallner", email = "swallner@mpp.mpg.de" },
]
description = "Tools for amplitude analysis, event selection, kinematic calculations, machine learning, and more"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = [
	'polars',
	'pyarrow',
	'tensorflow>=2.13.0',
	'tensorflow_probability',
	'tf-keras',
	'numpy',
	'scipy',
	'iminuit',
	'tabulate',
	'PyYaml',
	'sympy',
	'pandas',
	'uproot',
	'matplotlib',
	'numba',
  'pdg',
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
  "pytest >=6",
  "pytest-cov >=3",
]
dev = [
  "pytest >=6",
  "pytest-cov >=3",
  "pre-commit",
]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]

[project.urls]
Homepage = "https://gitlab.desy.de/belle2/physics/amplitudesatbelleii/sphysics"
Documentation = "https://belle2.pages.desy.de/physics/amplitudesatbelleii/sphysics"
"Bug Tracker" = "https://gitlab.desy.de/belle2/physics/amplitudesatbelleii/sphysics/issues"
"Public Issues" = "https://github.com/sAmplitudes/sphysics/issues"
Changelog = "https://gitlab.desy.de/belle2/physics/amplitudesatbelleii/sphysics/releases"
DOI = "https://doi.org/10.5281/zenodo.23214121"


[tool.scikit-build]
minimum-version = "0.4"
build-dir = "build/{wheel_tag}"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/sphysics/_version.py"]


[tool.setuptools_scm]
write_to = "src/sphysics/_version.py"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore:distutils Version classes are deprecated:DeprecationWarning",
]
log_cli_level = "INFO"
testpaths = [
  "test",
]


[tool.coverage]
run.source = ["sphysics"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "test"]
python_version = "3.8"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "sphysics.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.codespell]
write-changes = true


[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = [
  "B",        # flake8-bugbear
  "I",        # isort
  "ARG",      # flake8-unused-arguments
  "C4",       # flake8-comprehensions
  "EM",       # flake8-errmsg
  "ICN",      # flake8-import-conventions
  "G",        # flake8-logging-format
  "PGH",      # pygrep-hooks
  "PIE",      # flake8-pie
  "PL",       # pylint
  "PT",       # flake8-pytest-style
  "PTH",      # flake8-use-pathlib
  "RET",      # flake8-return
  "RUF",      # Ruff-specific
  "SIM",      # flake8-simplify
  "T20",      # flake8-print
  "UP",       # pyupgrade
  "YTT",      # flake8-2020
  "EXE",      # flake8-executable
  "NPY",      # NumPy specific rules
  "PD",       # pandas-vet
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "ISC001",   # Conflicts with formatter
]
isort.required-imports = ["from __future__ import annotations"]
# Uncomment if using a _compat.typing backport
# typing-modules = ["sphysics._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["T20"]
"noxfile.py" = ["T20"]


