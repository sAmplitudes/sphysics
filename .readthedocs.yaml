# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details
#
# Read the Docs does not build the documentation itself. Instead, ci/readthedocs.py downloads
# the HTML that the build_pages job of the GitLab CI built for the same commit, such that Read
# the Docs serves exactly the files that the pages job deploys to GitLab Pages. See the script
# for details and for the required environment variable GITLAB_TOKEN.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  commands:
    - python ci/readthedocs.py fetch
