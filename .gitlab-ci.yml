stages:
  - prepare
  - installable
  - check
  - test
  - build
  - deploy


variables:
  # see https://docs.gitlab.com/ee/ci/caching/#cache-python-dependencies
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONFAULTHANDLER: "1"



cache:
  - key: pip
    paths:
      - .cache/pip
    policy: pull
  - key: venv
    paths:
      - .venv
    policy: pull

image: python:3.11-trixie
before_script:
  # set up required software and a virtualenv to cache
  - apt-get update
  - apt-get install -y --no-install-recommends git
  - apt-get install -y dpkg-dev cmake g++ gcc binutils libx11-dev libxpm-dev
    libxft-dev libxext-dev python3 libssl-dev
  - export TF_ENABLE_ONEDNN_OPTS=0
  - python -V
  - python -m venv .venv
  - source .venv/bin/activate
  - python -m pip install -U pip pipx
  - python -m pip install 'tensorflow==2.21.0' torch torchmetrics torchinfo pylint==4.0.6 lightning
  - python -m pipx ensurepath
  - git clone
    https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.desy.de/belle2/physics/amplitudesatbelleii/softwarestack/modernplotting.git
  - cd modernplotting; python -m pip install .; cd ..
  - python -m pip freeze

preparevenv:
  stage: prepare
  script:
    - echo "All dependencies prepared"
  cache:
    - key: pip
      paths:
        - .cache/pip
      policy: push
    - key: venv
      paths:
        - .venv
      policy: push

installable-static:
  stage: installable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - python -V
    - python -m pip install .
    - python -c "import sphysics"

installable-editable:
  stage: installable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - python -V
    - python -m pip install --editable .
    - python -c "import sphysics"

build_pages:
  stage: build
  script:
    - python -V
    - python -m pip install .
    - pip install sphinx-book-theme
    - pip install sphinx_rtd_theme
    - cd docs
    - python -c 'import sphysics'
    - make clean
    - make html
    - mkdir -p ../public
    - cp -r _build/html/* ../public/
  artifacts:
    paths:
      - public

pages:
  stage: deploy
  dependencies:
    - build_pages
  script:
    - test -d public
    - ls -la public | head -n 20
  artifacts:
    paths:
      - public
  only:
  - main
  - tags

pre-commit:
  stage: check
  variables:
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - python -m pip install pre-commit
    - pre-commit run --hook-stage manual --all-files
  cache:
    key:
      files:
        - .pre-commit-config.yaml
    paths:
      - .cache/pre-commit

lint:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script: # first install all dependencies of sphysics
    - python -m pip install .
    - python -m pip uninstall -y sphysics
    - python -m pip install pylint-gitlab==2.1.1
    # print only the messages to the log and write them as code-quality report for the merge-request widget
    - pylint --rcfile src/sphysics/pylintrc --reports=n
      --output-format=text,pylint_gitlab.GitlabCodeClimateReporter:codeclimate.json src/sphysics
  artifacts:
    when: always
    reports:
      codequality: codeclimate.json
    paths:
      - codeclimate.json

tests:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - python -V
    - python -m pip install '.[test]'
    - python -m pytest -vv -ra --junitxml=pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
    paths:
      - pytest-report.xml

build_package:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - python -m pip install build twine
    - python -m build --sdist
    - python -m twine check dist/*
    - python -m pip install dist/*.tar.gz
    - python -c "import sphysics"
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

publish_package:
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  dependencies:
    - build_package
  variables:
    TWINE_REPOSITORY_URL: "https://gitlab.desy.de/api/v4/projects/${CI_PROJECT_ID}/packages/pypi"
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "${CI_JOB_TOKEN}"
  script:
    - python -m pip install twine
    - python -m twine upload --verbose dist/*
