stages:
  - prepare
  - installable
  - check
  - build
  - release-test
  - deploy


variables:
  # image with all dependencies preinstalled, built from ci/Dockerfile by the ci-image job
  CI_IMAGE: "$CI_REGISTRY_IMAGE/ci"
  PYTHONFAULTHANDLER: "1"
  TF_ENABLE_ONEDNN_OPTS: "0"
  # compiler warnings are errors in the CI builds (off by default, see CMakeLists.txt);
  # scikit-build-core passes this on to CMake as -DWERROR=ON
  SKBUILD_CMAKE_DEFINE: "WERROR=ON"

# The build requirements are part of the CI image. Hence, all builds use
# --no-build-isolation; otherwise pip downloads them again into a temporary
# build environment for every build. The exception is the
# install-from-testpypi job, which installs sphysics the way a user does.

default:
  image: "$CI_IMAGE:latest"

ci-image:
  stage: prepare
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - kubernetes-executor
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null
      changes:
        - ci/Dockerfile
        - pyproject.toml
    # a rule without `if` would also create merge-request pipelines
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    # the layer cache keeps the digests of unchanged layers, such that runner
    # nodes only download the layers that changed; cached layers expire after
    # 90 days (default: 2 weeks), afterwards unpinned packages get updated
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/ci/Dockerfile
      --build-arg=CI_JOB_TOKEN --cache=true --cache-repo=$CI_IMAGE/cache --cache-ttl=2160h
      --destination $CI_IMAGE:$CI_COMMIT_SHORT_SHA --destination $CI_IMAGE:latest

installable-static:
  stage: installable
  script:
    - python -m pip wheel --no-build-isolation --no-deps --wheel-dir wheelhouse .
    - python -m pip install wheelhouse/*.whl
    - python -c "import sphysics"
  # the wheel is reused by the jobs of the later stages
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 day

installable-editable:
  stage: installable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - python -m pip install --no-build-isolation --editable .
    - python -c "import sphysics"

build_pages:
  stage: build
  script:
    - python -m pip install wheelhouse/*.whl
    - cd docs
    - python -c 'import sphysics'
    - make clean
    - make html
    - mkdir -p ../public
    - cp -r _build/html/* ../public/
  artifacts:
    paths:
      - public

pages:
  stage: deploy
  dependencies:
    - build_pages
  script:
    - test -d public
    - ls -la public | head -n 20
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

readthedocs:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  # `needs` replaces the stage ordering, hence the release test is listed as well,
  # such that the documentation is published only if it succeeds; the artifacts
  # themselves are not needed here
  needs:
    - job: build_pages
      artifacts: false
    - job: install-from-testpypi
      artifacts: false
  script:
    # Read the Docs serves the artifacts of build_pages instead of building the documentation
    # itself (see .readthedocs.yaml and ci/readthedocs.py); READTHEDOCS_TOKEN is a masked CI/CD
    # variable of the project (if it is protected, the version tags must be protected tags too,
    # otherwise the variable is not available in tag pipelines)
    - python ci/readthedocs.py trigger


pre-commit:
  stage: check
  variables:
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - pre-commit run --hook-stage manual --all-files
  cache:
    key:
      files:
        - .pre-commit-config.yaml
    paths:
      - .cache/pre-commit

lint:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - pylint --rcfile src/sphysics/pylintrc --reports=n
      --output-format=text,pylint_gitlab.GitlabCodeClimateReporter:codeclimate.json src/sphysics
  artifacts:
    when: always
    reports:
      codequality: codeclimate.json
    paths:
      - codeclimate.json

tests:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - python -m pip install wheelhouse/*.whl
    - python -m pytest -vv -ra --junitxml=pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
    paths:
      - pytest-report.xml

build_package:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  dependencies: []
  script:
    - python -m build --sdist --no-isolation
    - python -m twine check dist/*
    - python -m pip install --no-build-isolation dist/*.tar.gz
    - python -c "import sphysics"
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

# The release-test stage runs for release tags only. It uploads the sdist to
# TestPyPI and then installs it from there the way a user does. The deploy stage
# (GitLab package registry, PyPI, documentation) starts only if this succeeds.

# TESTPYPI_TOKEN is an API token of test.pypi.org stored as masked CI/CD
# variable of the project (if it is protected, the version tags must be
# protected tags too, otherwise the variable is not available in tag pipelines)
publish_testpypi:
  stage: release-test
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  dependencies:
    - build_package
  variables:
    TWINE_REPOSITORY_URL: "https://test.pypi.org/legacy/"
    TWINE_USERNAME: "__token__"
    TWINE_PASSWORD: "${TESTPYPI_TOKEN}"
  script:
    # --skip-existing, such that the job can be retried; a version can be uploaded only once
    - python -m twine upload --verbose --skip-existing dist/*

# Installs the sdist uploaded to TestPyPI the way a user does with `pip install
# sphysics`: in a plain Python image with only a compiler, with pip build
# isolation (i.e. the build requirements come from pyproject.toml and not from
# the CI image), and with the default compiler flags (no -Werror).
install-from-testpypi:
  stage: release-test
  image: python:3.11-slim-trixie
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  needs:
    - job: publish_testpypi
      artifacts: false
  variables:
    # the repository is not needed
    GIT_STRATEGY: none
    SKBUILD_CMAKE_DEFINE: "WERROR=OFF"
    PIP_NO_CACHE_DIR: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_ROOT_USER_ACTION: "ignore"
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends g++ make
    - cd /tmp
    # Only the sdist of sphysics is taken from TestPyPI, by its URL; the build
    # requirements and dependencies are taken from PyPI. TestPyPI is not used
    # as package index, because anyone can upload packages with the names of
    # the dependencies there. The upload may take a moment to become available.
    - |
      for i in $(seq 1 30); do
        SDIST_URL=$(python -c "import json, urllib.request; r = json.load(urllib.request.urlopen('https://test.pypi.org/pypi/sphysics/${CI_COMMIT_TAG}/json')); print(next(u['url'] for u in r['urls'] if u['packagetype'] == 'sdist'))") && break
        echo "sphysics ${CI_COMMIT_TAG} is not yet available on TestPyPI, trying again in 10 s"
        sleep 10
      done
    - test -n "$SDIST_URL"
    - python -m pip install "$SDIST_URL"
    - python -c "import sphysics; print(sphysics.__file__)"

publish_package:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  dependencies:
    - build_package
  variables:
    TWINE_REPOSITORY_URL: "https://gitlab.desy.de/api/v4/projects/${CI_PROJECT_ID}/packages/pypi"
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "${CI_JOB_TOKEN}"
  script:
    - python -m twine upload --verbose dist/*

# PYPI_TOKEN is an API token of pypi.org stored as masked CI/CD variable of the
# project (see the comment on TESTPYPI_TOKEN)
publish_pypi:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  dependencies:
    - build_package
  variables:
    TWINE_USERNAME: "__token__"
    TWINE_PASSWORD: "${PYPI_TOKEN}"
  script:
    - python -m twine upload --verbose dist/*
